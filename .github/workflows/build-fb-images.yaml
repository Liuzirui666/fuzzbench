name: build-fb-images

on:
  workflow_dispatch:
    inputs:
      benchmarks:
        description: "Space-separated benchmarks (or 'ALL')"
        required: true
        default: "ALL"
      fuzzers:
        description: "Space-separated fuzzers (leave empty to use default list)"
        required: false
        default: ""
      push:
        description: "Push images to GHCR after build?"
        type: boolean
        required: true
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      # Default list you asked for (used if inputs.fuzzers is empty)
      DEFAULT_FUZZERS: "afl aflfast aflplusplus aflsmart entropic fairfuzz honggfuzz libfuzzer mopt eclipser"

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python deps for FuzzBench
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate Makefile & sanity check
        run: |
          # Generates docker/generated.mk etc.
          make install-dependencies
          make presubmit

      - name: Resolve benchmarks & fuzzers (flatten to one line)
        id: lists
        shell: bash
        run: |
          set -euo pipefail

          # Benchmarks
          if [[ "${{ github.event.inputs.benchmarks }}" == "ALL" || -z "${{ github.event.inputs.benchmarks }}" ]]; then
            BENCH="$(ls -1 benchmarks | paste -sd' ' -)"
          else
            BENCH="${{ github.event.inputs.benchmarks }}"
          fi

          # Fuzzers
          if [[ -z "${{ github.event.inputs.fuzzers }}" ]]; then
            FUZ="$DEFAULT_FUZZERS"
          else
            FUZ="${{ github.event.inputs.fuzzers }}"
          fi

          echo "BENCHMARKS=$BENCH" >> "$GITHUB_ENV"
          echo "FUZZERS=$FUZ" >> "$GITHUB_ENV"

          echo "bench_out=$BENCH" >> "$GITHUB_OUTPUT"
          echo "fuzz_out=$FUZ"   >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR (optional push)
        if: ${{ inputs.push }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build all fuzzer–benchmark pairs
        shell: bash
        run: |
          set -euo pipefail
          echo "Fuzzers:    $FUZZERS"
          echo "Benchmarks: $BENCHMARKS"

          # Build sequentially to keep runner memory usage reasonable.
          # You can adjust -j to parallelize if your runner is large enough.
          for f in $FUZZERS; do
            for b in $BENCHMARKS; do
              echo "::group::Building $f on $b"
              make -j2 "build-$f-$b"
              echo "::endgroup::"
            done
          done

      # Optional: tag/push locally built images to GHCR if you want a remote cache.
      # FuzzBench’s builder uses standard names; this step is skipped unless you enable push.
      - name: Tag & push images to GHCR (optional)
        if: ${{ inputs.push }}
        shell: bash
        run: |
          set -euo pipefail
          OWNER_LC="$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          REG_BASE="ghcr.io/${OWNER_LC}/fuzzbench"

          for f in $FUZZERS; do
            for b in $BENCHMARKS; do
              # Builder and runner image names used by FuzzBench’s Makefile
              # (build-* target produces these). See docs for the build flow. 
              # We re-tag to GHCR so other machines can pull/copy layers easily.
              SRC_BUILDER="gcr.io/fuzzbench/builders/${f}/${b}"
              SRC_RUNNER="gcr.io/fuzzbench/runners/${f}/${b}"

              DST_BUILDER="${REG_BASE}/builders/${f}/${b}:latest"
              DST_RUNNER="${REG_BASE}/runners/${f}/${b}:latest"

              if docker image inspect "$SRC_BUILDER" > /dev/null 2>&1; then
                docker tag "$SRC_BUILDER" "$DST_BUILDER"
                docker push "$DST_BUILDER"
              fi
              if docker image inspect "$SRC_RUNNER" > /dev/null 2>&1; then
                docker tag "$SRC_RUNNER" "$DST_RUNNER"
                docker push "$DST_RUNNER"
              fi
            done
          done
