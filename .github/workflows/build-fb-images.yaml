name: build-fb-images

on:
  workflow_dispatch:
    inputs:
      benchmarks:
        description: "Space-separated benchmarks (or 'ALL')"
        required: true
        default: "ALL"
      fuzzers:
        description: "Space-separated fuzzers (leave empty to use default list)"
        required: false
        default: ""
      push:
        description: "Push images to GHCR after build?"
        type: boolean
        required: true
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      # EXACT list you asked for:
      DEFAULT_FUZZERS: "afl aflfast aflplusplus aflsmart fairfuzz honggfuzz libfuzzer mopt eclipser"

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          # Full history not required since we skip presubmit
          fetch-depth: 1
          submodules: false

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Create venv & install deps
        run: |
          python -m venv .venv
          source .venv/bin/activate
          python -m pip install -U pip
          pip install -r requirements.txt

      - name: Generate FuzzBench Makefile
        run: |
          source .venv/bin/activate
          PYTHONPATH=. python3 docker/generate_makefile.py docker/generated.mk

      - name: Resolve benchmarks & fuzzers (flatten to one line)
        id: lists
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event.inputs.benchmarks }}" == "ALL" || -z "${{ github.event.inputs.benchmarks }}" ]]; then
            BENCH="$(ls -1 benchmarks | paste -sd' ' -)"
          else
            BENCH="${{ github.event.inputs.benchmarks }}"
          fi
          if [[ -z "${{ github.event.inputs.fuzzers }}" ]]; then
            FUZ="$DEFAULT_FUZZERS"
          else
            FUZ="${{ github.event.inputs.fuzzers }}"
          fi
          echo "BENCHMARKS=$BENCH" >> "$GITHUB_ENV"
          echo "FUZZERS=$FUZ" >> "$GITHUB_ENV"
          echo "Benchmarks: $BENCH"
          echo "Fuzzers:    $FUZ"

      - name: (Optional) Login to GHCR
        if: ${{ inputs.push }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build all fuzzer–benchmark pairs
        shell: bash
        run: |
          set -euo pipefail
          source .venv/bin/activate
          for f in $FUZZERS; do
            for b in $BENCHMARKS; do
              echo "::group::make build-$f-$b"
              make -j2 "build-$f-$b"
              echo "::endgroup::"
            done
          done

      # Optional publish to GHCR so Unity can apptainer-pull:
      - name: Tag & push images to GHCR (optional)
        if: ${{ inputs.push }}
        shell: bash
        run: |
          set -euo pipefail
          OWNER_LC="$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          REG_BASE="ghcr.io/${OWNER_LC}/fuzzbench"
          # Builder/runner names produced by FuzzBench build targets:
          for f in $FUZZERS; do
            for b in $BENCHMARKS; do
              SRC_BUILDER="gcr.io/fuzzbench/builders/${f}/${b}"
              SRC_RUNNER="gcr.io/fuzzbench/runners/${f}/${b}"
              DST_BUILDER="${REG_BASE}/builders/${f}/${b}:latest"
              DST_RUNNER="${REG_BASE}/runners/${f}/${b}:latest"
              if docker image inspect "$SRC_BUILDER" >/dev/null 2>&1; then
                docker tag "$SRC_BUILDER" "$DST_BUILDER"
                docker push "$DST_BUILDER"
              fi
              if docker image inspect "$SRC_RUNNER" >/dev/null 2>&1; then
                docker tag "$SRC_RUNNER" "$DST_RUNNER"
                docker push "$DST_RUNNER"
              fi
            done
          done
