name: build-fb-images
on:
  workflow_dispatch:
    inputs:
      fuzzers:
        description: "Space-separated fuzzers"
        required: true
        default: "afl aflfast aflplusplus aflsmart entropic fairfuzz honggfuzz libfuzzer mopt eclipser"
      benchmarks:
        description: "Space-separated benchmarks (or 'ALL')"
        required: true
        default: "ALL"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      REG: ghcr.io/${{ github.repository_owner }}/fuzzbench
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Expand lists
        id: lists
        run: |
          if [ "${{ github.event.inputs.benchmarks }}" = "ALL" ]; then
            BENCH="$(ls -1 benchmarks)"
          else
            BENCH="${{ github.event.inputs.benchmarks }}"
          fi
          echo "FUZZERS=${{ github.event.inputs.fuzzers }}" >> $GITHUB_ENV
          echo "BENCHMARKS=${BENCH}" >> $GITHUB_ENV

      - name: Build & push (matrix emulation)
        run: |
          set -euxo pipefail
          for F in $FUZZERS; do
            for B in $BENCHMARKS; do
              # Standard FuzzBench builder layout: each combo gets its own image.
              # We reuse the same Docker build context the dispatcher would use.
              TAG="${REG}/${B}-${F}:latest"
              echo "==> Building ${TAG}"
              docker build \
                --build-arg FUZZER="${F}" \
                --build-arg BENCHMARK="${B}" \
                -f docker/benchmark-runner.Dockerfile \
                -t "${TAG}" .
              docker push "${TAG}"
            done
          done
